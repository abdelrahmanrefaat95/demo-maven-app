---
# The app is a Java 17 jar, so the JRE must exist before we copy it.
- name: Install the Java runtime
  ansible.builtin.apt:
    name: openjdk-17-jre-headless
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: prepare

# A dedicated account limits the permissions available to the running app.
- name: Create the application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  tags: prepare

# Predictable writable locations keep application files out of personal homes.
- name: Create the application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"
  loop:
    - "{{ app_home }}"
    - "{{ app_config_dir }}"
  tags: prepare

# A role resolves templates relative to itself; this is the one visible difference and the class will be asked to spot it.
- name: Render the environment file
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ app_config_dir }}/app.env"
    owner: root
    group: root
    mode: "0640"
  notify: Restart the application
  tags: prepare

# A role resolves templates relative to itself; this is the one visible difference and the class will be asked to spot it.
- name: Install the systemd unit file
  ansible.builtin.template:
    src: devops-demo.service.j2
    dest: /etc/systemd/system/devops-demo.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart the application
  tags: prepare

# Enabling the unit makes the application return after a server reboot.
- name: Enable the service at boot
  ansible.builtin.systemd_service:
    name: devops-demo
    enabled: true
    daemon_reload: true
  tags: prepare

# Copying the built artifact makes the requested version available to run.
- name: Copy the application jar to the server
  ansible.builtin.copy:
    src: "{{ app_jar }}"
    dest: "{{ app_home }}/app.jar"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"
  notify: Restart the application
  tags: deploy

# Starting after the copy provides a working service on a first deployment.
- name: Make sure the service is running
  ansible.builtin.systemd_service:
    name: devops-demo
    state: started
  tags: deploy
