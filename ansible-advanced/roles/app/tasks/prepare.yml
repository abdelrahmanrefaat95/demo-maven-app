---
- name: Install the Java runtime
  ansible.builtin.apt:
    name: "{{ app_java_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the service group
  ansible.builtin.group:
    name: "{{ app_user }}"
    system: true

- name: Create the service account
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ app_home }}"
    create_home: false

- name: Create the application directory
  ansible.builtin.file:
    path: "{{ app_home }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Create the configuration directory
  ansible.builtin.file:
    path: "{{ app_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render the environment file
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ app_config_dir }}/app.env"
    owner: root
    group: root
    mode: "0600"
  notify: Restart app

- name: Install the systemd unit
  ansible.builtin.template:
    src: devops-demo.service.j2
    dest: /etc/systemd/system/devops-demo.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart app

- name: Enable the service at boot
  ansible.builtin.systemd_service:
    name: devops-demo
    enabled: true
    daemon_reload: true
