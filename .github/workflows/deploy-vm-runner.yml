name: deploy-vm-runner

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-app-dev
  cancel-in-progress: false

jobs:
  build:
    name: build the jar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Package without tests
        run: ./mvnw -B -ntp -DskipTests package

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/devops-demo-1.0.0.jar
          retention-days: 1

  deploy:
    name: deploy on app-dev
    needs: build
    runs-on: [self-hosted, app-dev]
    environment: dev
    timeout-minutes: 10
    steps:
      - name: Download the jar
        uses: actions/download-artifact@v8
        with:
          name: app-jar

      - name: Install the jar and restart the service
        run: sudo /usr/local/bin/deploy-devops-demo.sh "$PWD/devops-demo-1.0.0.jar"

      - name: Wait until the app is ready
        run: curl -fsS --retry 12 --retry-delay 5 --retry-all-errors http://localhost:8080/actuator/health/readiness
