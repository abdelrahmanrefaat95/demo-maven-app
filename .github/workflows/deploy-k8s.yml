name: deploy-k8s

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-k8s
  cancel-in-progress: false

jobs:
  build:
    name: build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Work out the image name
        id: image
        run: echo "ref=docker.io/${{ vars.DOCKERHUB_USERNAME }}/devops-demo:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.ref }}

  deploy:
    name: deploy to kubernetes
    needs: build
    runs-on: [self-hosted, control]
    environment: production
    timeout-minutes: 10
    steps:
      - name: Show which cluster we are talking to
        run: kubectl config current-context

      - name: Point the Deployment at the new image
        run: kubectl -n devops-demo set image deployment/devops-demo app=${{ needs.build.outputs.image }}

      - name: Wait for the rollout
        run: kubectl -n devops-demo rollout status deployment/devops-demo --timeout=300s

      - name: Smoke test
        run: curl -fsS http://localhost:30080/api/info
