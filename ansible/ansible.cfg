[defaults]
# A nearby inventory keeps every classroom command short and predictable.
inventory = inventory.ini
# Using one known key avoids prompting students during each exercise.
private_key_file = ~/.ssh/devops-key.pem
# Automatic discovery works across the Ubuntu images used in the lab.
interpreter_python = auto_silent
# YAML output is easier for beginners to connect to playbook syntax.
callback_result_format = yaml
