[app_servers]
# This name lets students target development without memorizing its address.
app-dev     ansible_host=DEV_HOST_IP     app_profile=dev
# A distinct profile lets condition examples behave differently per host.
app-staging ansible_host=STAGING_HOST_IP app_profile=staging

[app_servers:vars]
# A group-level login keeps the same connection identity for both hosts.
ansible_user=ubuntu
